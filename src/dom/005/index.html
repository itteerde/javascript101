<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Canvas</title>
    <style>
        /* Essential CSS to remove scrollbars and margins */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Removes scrollbars */
            background-color: #000; /* Optional: sets a background */
        }

        canvas {
            display: block; /* Removes the default 'inline' bottom gap */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>

    <script src="index.js"></script>
</body>
</html>
